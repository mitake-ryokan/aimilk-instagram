name: AIみるく 週次投稿

# ■ これは何か
# GitHubが用意している「決まった時間に勝手にプログラムを動かす」仕組み（GitHub Actions）。
# 3号さんのパソコンが閉じていても、GitHubのサーバーが代わりに動かしてくれる。無料。

on:
  schedule:
    # cron は UTC（世界標準時）で書く。日本時間は UTC+9。
    # 日本時間の木曜18:00 に投稿したい → UTC では木曜09:00
    - cron: "0 9 * * 4"
  workflow_dispatch:      # 画面のボタンから手動でも実行できるようにする
    inputs:
      dry_run:
        description: "投稿せず、画像とキャプションの生成だけ試す"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 生成した画像をリポジトリにコミットするために必要

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ■ なぜ失敗しても止めないのか（2026-08-19 追加）
      # GitHubのサーバーが使うaptの配布元（azure.archive.ubuntu.com）が
      # 応答しないことがあり、ここで何分もハングして投稿ごと落ちた。
      # フォントが入らなかった場合は、このあとのPython側が
      # 「日本語フォントが見つかりません」とはっきり落としてくれる。
      # だからここは早めに諦めて先へ進んでよい。黙って変な画像が出る心配はない。
      - name: 日本語フォントを入れる
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo apt-get update -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 || true
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk fonts-noto-cjk-extra || true
          fc-list | grep -i "noto sans cjk" | head -3 || true

      # ■ aptが使えなかったときの逃げ道（2026-08-19 追加）
      # GitHubのサーバーのapt配布元は、実際に何度も応答しなくなった。
      # そのたびに投稿が止まるのは割に合わないので、フォントそのものを
      # GitHubから直接もらってくる道を用意する。
      # 画像の公開でどのみちGitHubに頼っているので、頼る先は増えていない。
      - name: フォントが入らなかったときは直接もらう
        run: |
          set -e
          if fc-list 2>/dev/null | grep -qi "noto sans cjk"; then
            echo "aptで入ったのでスキップします"
            exit 0
          fi
          echo "aptで入らなかったので、GitHubから直接もらいます"
          sudo mkdir -p /usr/share/fonts/truetype/noto
          BASE=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP
          for f in NotoSansJP-Black.otf NotoSansJP-Bold.otf NotoSansJP-Medium.otf NotoSansJP-Regular.otf; do
            sudo curl -fsSL --retry 3 -o "/usr/share/fonts/truetype/noto/$f" "$BASE/$f"
          done
          ls -l /usr/share/fonts/truetype/noto/

      - name: 必要なライブラリを入れる
        run: pip install -r requirements.txt

      - name: 投稿を作って出す
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 以下は任意。GH_PAT を入れておくと、延長したトークンを自動で保存する
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/run_weekly.py --dry-run
          else
            python src/run_weekly.py
          fi

      # 失敗したらGitHubから3号さんにメールが届く（GitHubの標準機能）。
      # 「静かに止まる」のを防ぐのがこの仕組みの目的。
      - name: 失敗したことを分かりやすく残す
        if: failure()
        run: echo "::error::AIみるくの週次投稿に失敗しました。ログを確認してください。"

  # ■ 町のPDFを見に行く（2026-08-21 追加）
  # 投稿とは別の仕事なので、別のjobにしてある。ここで何が起きても投稿は落ちない。
  # 時計は増やしていない。上の投稿と同じ木曜のcronで一緒に動く。
  #
  # needs: post を付けて、投稿が終わってから動かしている。
  # 同じリポジトリに2つが同時にコミットしにいくと、ぶつかるため。
  # if: always() にしてあるので、投稿が失敗した週でもこちらは動く。
  town-docs:
    needs: post
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 読んだ記録（state/）をコミットするため
      issues: write       # 見つけたことをIssueで知らせるため

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリを入れる
        run: pip install -r requirements.txt

      # ■ ここは dry_run を見ていない（2026-08-21）
      # 上の dry_run は「Instagramに出さずに試す」ためのつまみ。
      # こちらはそもそもInstagramに出さないので、止める理由がない。
      # 新しいPDFが無い週は何も起きず、Issueも立たない。
      - name: 町のPDFを見に行く
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/town_docs.py
