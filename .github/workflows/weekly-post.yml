name: AIみるく 週次投稿

# ■ これは何か
# GitHubが用意している「決まった時間に勝手にプログラムを動かす」仕組み（GitHub Actions）。
# 3号さんのパソコンが閉じていても、GitHubのサーバーが代わりに動かしてくれる。無料。

on:
  schedule:
    # cron は UTC（世界標準時）で書く。日本時間は UTC+9。
    # 日本時間の木曜18:00 に投稿したい → UTC では木曜09:00
    - cron: "0 9 * * 4"
  workflow_dispatch:      # 画面のボタンから手動でも実行できるようにする
    inputs:
      dry_run:
        description: "投稿せず、画像とキャプションの生成だけ試す"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 生成した画像をリポジトリにコミットするために必要

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリを入れる
        run: pip install -r requirements.txt

      - name: 投稿を作って出す
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 以下は任意。GH_PAT を入れておくと、延長したトークンを自動で保存する
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/run_weekly.py --dry-run
          else
            python src/run_weekly.py
          fi

      # 失敗したらGitHubから3号さんにメールが届く（GitHubの標準機能）。
      # 「静かに止まる」のを防ぐのがこの仕組みの目的。
      - name: 失敗したことを分かりやすく残す
        if: failure()
        run: echo "::error::AIみるくの週次投稿に失敗しました。ログを確認してください。"
